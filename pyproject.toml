[project]
name = "inkwell"
version = "0.2.0"
description = "Presidio-based scrubber for sensitive records (PDF, images, email, Office, HTML, zip)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "presidio-analyzer==2.2.358",
    "presidio-anonymizer==2.2.358",
    "spacy>=3.8,<3.9",
    # Not on PyPI: a pinned release URL so `uv tool install`/pipx of a release wheel gets the model.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "pymupdf>=1.26,<1.27",
    "pytesseract==0.3.13",
    "pillow>=11,<12",
    "opencv-python-headless>=4.11,<4.12",
    "python-docx>=1.1,<1.2",
    "openpyxl>=3.1,<3.2",
    "beautifulsoup4>=4.13,<4.14",
    "lxml>=5.3,<6",
]

[project.urls]
Homepage = "https://github.com/pu-shd/inkwell"
Issues = "https://github.com/pu-shd/inkwell/issues"
Changelog = "https://github.com/pu-shd/inkwell/blob/main/CHANGELOG.md"

[project.scripts]
inkwell = "inkwell.cli:main"
inkwell-db = "inkwell.accessdb:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<0.12",
    "mypy>=1.15,<1.16",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/inkwell"]

# The sdist is public: list what goes in rather than relying on .gitignore (scripts/check_dist.py
# rejects anything else).
[tool.hatch.build.targets.sdist]
only-include = ["src/inkwell", "tests", "README.md", "CHANGELOG.md", "pyproject.toml", "uv.lock"]
exclude = ["__pycache__", "*.pyc"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: OCR / end-to-end tests"]
