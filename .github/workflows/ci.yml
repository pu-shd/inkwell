name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker compose build test
      - name: Lint, type-check, test (no network)
        run: docker compose run --rm test

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - name: Build wheel and sdist
        run: uv build --python 3.12
      - name: Check distributions (allow-listed contents, version metadata)
        run: |
          v="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python3 scripts/check_dist.py dist "$v"
